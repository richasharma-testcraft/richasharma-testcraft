<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Animated terminal showing a Playwright test run passing" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="798" height="248" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1,13 a12,12 0 0 1 12,-12 h774 a12,12 0 0 1 12,12 v21 h-798z" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#f85149"/>
  <circle cx="44" cy="18" r="6" fill="#d29922"/>
  <circle cx="64" cy="18" r="6" fill="#2ea043"/>
  <text x="400" y="23" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#8b949e">bash</text>

  <g font-family="Consolas,Menlo,monospace" font-size="15">
    <text x="24" y="66" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> npx playwright test
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.05;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="94" fill="#8b949e" opacity="0">Running tests in parallel...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="122" fill="#3fb950" opacity="0">  &#10003;  login.spec.ts
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.29;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="146" fill="#3fb950" opacity="0">  &#10003;  checkout.spec.ts
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.40;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="170" fill="#3fb950" opacity="0">  &#10003;  api/orders.spec.ts
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.51;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="194" fill="#3fb950" opacity="0">  &#10003;  smoke/health.spec.ts
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.62;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="222" fill="#3fb950" font-weight="bold" opacity="0">&#10004; All tests passed
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.74;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <rect x="228" y="208" width="9" height="17" fill="#2f81f7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.74;0.78;0.84;0.88;0.92;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
