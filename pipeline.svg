<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Animated automated quality pipeline: commit, build, API tests, UI tests, Jenkins, report" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="220" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#c9d1d9">Automated quality pipeline</text>

  <line x1="70" y1="110" x2="735" y2="110" stroke="#30363d" stroke-width="3" stroke-dasharray="6 6"/>

  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- 1 Commit -->
    <rect x="12" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="-0.2s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="106" font-size="13" font-weight="600" fill="#e6edf3">Commit</text>
    <text x="70" y="124" font-size="10.5" fill="#8b949e">git push</text>

    <!-- 2 Build -->
    <rect x="145" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="106" font-size="13" font-weight="600" fill="#e6edf3">Build</text>
    <text x="203" y="124" font-size="10.5" fill="#8b949e">Maven &#183; npm</text>

    <!-- 3 API tests -->
    <rect x="278" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="336" y="106" font-size="13" font-weight="600" fill="#e6edf3">API Tests</text>
    <text x="336" y="124" font-size="10.5" fill="#8b949e">REST Assured</text>

    <!-- 4 UI tests -->
    <rect x="411" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="469" y="106" font-size="13" font-weight="600" fill="#e6edf3">UI Tests</text>
    <text x="469" y="124" font-size="10.5" fill="#8b949e">Playwright</text>

    <!-- 5 Jenkins -->
    <rect x="544" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="4.6s" repeatCount="indefinite"/>
    </rect>
    <text x="602" y="106" font-size="13" font-weight="600" fill="#e6edf3">Jenkins</text>
    <text x="602" y="124" font-size="10.5" fill="#8b949e">Jenkinsfile</text>

    <!-- 6 Report -->
    <rect x="677" y="80" width="116" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#2ea043;#2ea043;#30363d" keyTimes="0;0.05;0.85;1" dur="6s" begin="5.8s" repeatCount="indefinite"/>
    </rect>
    <text x="735" y="106" font-size="13" font-weight="600" fill="#e6edf3">Report</text>
    <text x="735" y="124" font-size="10.5" fill="#8b949e">HTML reports</text>
  </g>

  <!-- moving glow + dot -->
  <circle r="13" cy="110" fill="#2f81f7" opacity="0.25">
    <animateMotion path="M70,0 L735,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" cy="110" fill="#2f81f7">
    <animateMotion path="M70,0 L735,0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="400" y="190" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Every push triggers build, tests and reports, with fast feedback to the team</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
