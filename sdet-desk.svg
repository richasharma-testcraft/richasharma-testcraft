<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Animated illustration of an SDET at a laptop while automated tests turn green and a bug gets caught" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="280" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- desk -->
  <rect x="40" y="222" width="720" height="10" rx="5" fill="#21262d"/>

  <!-- laptop -->
  <rect x="330" y="72" width="250" height="142" rx="8" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <rect x="310" y="214" width="290" height="8" rx="4" fill="#30363d"/>
  <text x="344" y="90" font-family="Consolas,Menlo,monospace" font-size="11" fill="#8b949e">test-suite</text>

  <!-- test rows -->
  <g font-family="Consolas,Menlo,monospace">
    <circle cx="352" cy="110" r="8" fill="#484f58">
      <animate attributeName="fill" values="#484f58;#484f58;#2ea043;#2ea043;#484f58" keyTimes="0;0.15;0.17;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="352" y="113.5" text-anchor="middle" font-size="10" fill="#ffffff" opacity="0">&#10003;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.92;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <rect x="370" y="106" width="130" height="8" rx="4" fill="#30363d"/>

    <circle cx="352" cy="136" r="8" fill="#484f58">
      <animate attributeName="fill" values="#484f58;#484f58;#2ea043;#2ea043;#484f58" keyTimes="0;0.30;0.32;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="352" y="139.5" text-anchor="middle" font-size="10" fill="#ffffff" opacity="0">&#10003;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.32;0.92;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <rect x="370" y="132" width="160" height="8" rx="4" fill="#30363d"/>

    <circle cx="352" cy="162" r="8" fill="#484f58">
      <animate attributeName="fill" values="#484f58;#484f58;#2ea043;#2ea043;#484f58" keyTimes="0;0.45;0.47;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="352" y="165.5" text-anchor="middle" font-size="10" fill="#ffffff" opacity="0">&#10003;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.92;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <rect x="370" y="158" width="110" height="8" rx="4" fill="#30363d"/>

    <circle cx="352" cy="188" r="8" fill="#484f58">
      <animate attributeName="fill" values="#484f58;#484f58;#2ea043;#2ea043;#484f58" keyTimes="0;0.60;0.62;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="352" y="191.5" text-anchor="middle" font-size="10" fill="#ffffff" opacity="0">&#10003;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.62;0.92;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <rect x="370" y="184" width="145" height="8" rx="4" fill="#30363d"/>

    <text x="545" y="205" text-anchor="end" font-size="11" font-weight="bold" fill="#3fb950" opacity="0">ALL PASSING
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.72;0.92;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- person -->
  <rect x="205" y="138" width="86" height="84" rx="30" fill="#2f81f7"/>
  <circle cx="248" cy="108" r="26" fill="#f1c9a5"/>
  <path d="M222,104 a26,26 0 0 1 52,0 q-26,-14 -52,0z" fill="#8b5e3c"/>
  <path d="M219,106 a29,29 0 0 1 58,0" fill="none" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  <rect x="213" y="104" width="9" height="16" rx="4" fill="#c9d1d9"/>
  <circle cx="262" cy="109" r="2.6" fill="#0d1117">
    <animate attributeName="r" values="2.6;2.6;0.3;2.6" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <path d="M256,122 q6,4 12,0" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>

  <!-- typing arm -->
  <g>
    <path d="M272,165 L326,207" stroke="#2f81f7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="328" cy="208" r="6" fill="#f1c9a5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 -2;0 0" dur="0.6s" repeatCount="indefinite"/>
  </g>

  <!-- coffee mug with steam -->
  <rect x="650" y="190" width="28" height="32" rx="5" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
  <path d="M678,198 q12,0 12,10 q0,10 -12,10" fill="none" stroke="#8b949e" stroke-width="3"/>
  <g fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" opacity="0">
    <path d="M657,184 q-6,-9 0,-18">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M664,184 q-6,-9 0,-18">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M671,184 q-6,-9 0,-18">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- bug that gets caught -->
  <g>
    <ellipse cx="730" cy="212" rx="10" ry="6" fill="#f85149"/>
    <circle cx="719" cy="212" r="4" fill="#f85149"/>
    <g stroke="#f85149" stroke-width="1.5" stroke-linecap="round">
      <line x1="725" y1="216" x2="722" y2="221"/>
      <line x1="730" y1="217" x2="730" y2="222"/>
      <line x1="735" y1="216" x2="738" y2="221"/>
      <line x1="717" y1="209" x2="713" y2="204"/>
      <line x1="721" y1="208" x2="719" y2="203"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-95 0;-95 0" keyTimes="0;0.6;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.65;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <text x="705" y="160" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#3fb950" opacity="0">bug caught before release
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.68;0.92;1" dur="10s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
